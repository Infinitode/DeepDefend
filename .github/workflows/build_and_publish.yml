name: Publish Python 🐍 distributions 📦 to PyPI

on:
  push:
    tags:
      - "v*"

# Least privilege at the workflow level.
permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip build twine
      - name: Verify the tag matches the packaged version
        run: |
          python - <<'PY'
          import os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          if tag != version:
              sys.exit(f"Tag {tag!r} does not match pyproject version {version!r}")
          print(f"Building {version}")
          PY
      - name: Run the test-suite before publishing
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Build sdist and wheel
        run: |
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/deepdefend/
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Trusted Publishing (OIDC) is not registered for this project on PyPI,
      # so uploads use the existing PYPI_API_TOKEN secret (as 0.1.x releases did).
      # Attestations require OIDC, so they stay off.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
          skip-existing: true
          attestations: false
