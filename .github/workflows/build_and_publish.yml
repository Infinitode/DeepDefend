name: Publish Python 🐍 distributions 📦 to PyPI

on:
  push:
    tags:
      - "v*"

# Least privilege at the workflow level; the publish job widens `id-token` only.
permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip build twine
      - name: Verify the tag matches the packaged version
        run: |
          python - <<'PY'
          import os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          if tag != version:
              sys.exit(f"Tag {tag!r} does not match pyproject version {version!r}")
          print(f"Building {version}")
          PY
      - name: Run the test-suite before publishing
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Build sdist and wheel
        run: |
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/deepdefend/
    permissions:
      # Trusted Publishing (OIDC). No long-lived API token is stored.
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
